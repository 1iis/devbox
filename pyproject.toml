[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "devbox"
version = "0.1.0"
description = "A small SWE workstation setup built for a host machine and a Docker container, with one work identity shared across both."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
