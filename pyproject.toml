[project]
name = "devbox"
version = "0.1.1"
description = "A small reproducible SWE workstation setup for a host machine and disposable Docker container."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
